<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Minha Conta - EventFlow</title>    

    <link rel="icon" type="image/png" href="../../img/Logo eventflow.png">
    
    <link rel="stylesheet" href="../home.css">
    <link rel="stylesheet" href="conta.css">
</head>

<body>

    <header class="header-eventflow" id="headerPill">
        <div class="logo-area">
            <img src="../../img/Logo texto solo.png" alt="Logo EventFlow" class="img-logo">
        </div>
        <nav class="menu-horizontal-links">
            <span id="headerNomeUsuario" class="header-nome-usuario"></span>
            <a href="../home.html">Início</a>
            <a id="linkMeusEventos" href="../meus-eventos/meus-eventos.html" style="display:none">Meus Eventos</a>
            <a href="#">Ingressos</a>
            <a href="#" onclick="logout('../../login/login.html')">Sair</a>
        </nav>
        <button class="menu-hamburguer" id="btnMenu">
            <span class="barrinha"></span>
            <span class="barrinha"></span>
            <span class="barrinha"></span>
        </button>
    </header>

    <div class="overlay" id="overlay"></div>

    <main class="conta-wrapper">
        <section class="menu-conta-card">
            <div class="avatar-topo">
                <div class="avatar-container">
                    <div class="avatar-image">?</div>
                    
                    <label for="avatarInput" class="btn-upload-avatar" title="Alterar foto de perfil">
                        <svg xmlns="http://www.w3.org/2000/svg" width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round">
                            <path d="M23 19a2 2 0 0 1-2 2H3a2 2 0 0 1-2-2V8a2 2 0 0 1 2-2h4l2-3h6l2 3h4a2 2 0 0 1 2 2z"></path>
                            <circle cx="12" cy="13" r="4"></circle>
                        </svg>
                    </label>
                    
                    <input type="file" id="avatarInput" accept="image/png, image/jpeg" style="display: none;">
                </div>
                
                <div id="avatarError" class="avatar-error"></div>

                <h2>Carregando...</h2> 
            </div>

            <nav class="opcoes-conta">
                <a href="../info-pessoal/info-pessoais.html" class="btn-opcao">
                    Informações Pessoais
                </a>
                <a href="#" class="btn-opcao">
                    Segurança e Senha
                </a>
                <a href="#" class="btn-opcao btn-excluir" onclick="abrirModalExcluir(event)">
                    Excluir Minha Conta
                </a>
                <a href="#" onclick="logout('../../login/login.html')" class="btn-opcao logout">
                    Sair da Conta
                </a>
            </nav>
        </section>
    </main>

    <div id="modalExcluir" class="modal-container">
        <div class="modal-content">
            <h3>Excluir Conta?</h3>
            <p>Esta ação é permanente e você perderá acesso a todos os seus ingressos no EventFlow.</p>
            <div class="modal-buttons">
                <button class="btn-cancelar" onclick="fecharModal()">Cancelar</button>
                <button class="btn-confirmar-exclusao" id="btnFinalExcluir">Confirmar Exclusão</button>
            </div>
        </div>
    </div>

    <script src="../../session.js"></script>
    <script src="../home.js"></script>
    <script src="conta.js"></script>
</body>
</html>
